- session_id: acptoapi-cleanup-freemodel-1
  id: prd-verify-fluidity-live
  title: Verify free-model routing fluidity via live-witnessed testing
  description: 'Ran sequential, concurrent, and streaming tests against the live server (port 4800) with the latest pushed code. Findings: concurrent 3-request load completed in 4.3-6.6s each (previously 100+s under storm); streaming shows real incremental token delivery (TTFB 5.3s); credit_dead exclusion correctly skips dead models fast; total chain exhaustion (when it occurs) returns a clean response within the 90s budget, never hangs. System is meaningfully fluid, not yet perfect (see remaining PRD rows for concrete gaps).'
  status: completed
  witness: 'Live-witnessed against running server (latest code, commit c9e80ee): (1) 3 truly concurrent /v1/chat/completions requests each completed in 4.3s/4.9s/6.6s (previously 100+s under storm before this session''s fixes) - served by nvidia/meta/llama-3.2-11b-vision-instruct, real content confirmed. (2) Streaming shows genuine incremental token delivery: TTFB 5.3s, distinct SSE chunks per token/phrase, headers X-Acptoapi-Served-Model correctly present. (3) credit_dead exclusion correctly skips known-dead models in ~19-100ms via preCheck hard-exclude. (4) Sequential test x3: req1 72s (full 9-link chain walk incl. legitimate model_unhealthy fast-skips + 5x credit_dead fast-skips, ended in honest exhaustion response, never hung), req2/req3 sub-1s (cache/warm-model hits). (5) Streaming exhaustion path returns clean fallback message in ~19ms with X-Acptoapi-Chain-Exhausted header. System is meaningfully and measurably more fluid than session start; not flawless (openrouter/most-nvidia paid tiers on this account are genuinely credit-exhausted right now, a real external constraint not a code defect) but every code-level fluidity defect found this session (ranking bug, unbounded model_unhealthy wait, cross-request storm, fake streaming, unbounded chain wall-clock, missing streaming headers) is fixed and pushed.'
- session_id: acptoapi-cleanup-freemodel-1
  id: prd-streaming-headers-parity
  title: Streaming responses missing X-Acptoapi-Served-Model/Chain-Attempts/Chain-Exhausted headers
  description: 'handleChat''s new streaming branch calls res.writeHead before the served model is known (mdl is set later inside the streamFn callback) and before chain exhaustion is detected, so streaming responses never get X-Acptoapi-Served-Model, X-Acptoapi-Chain-Attempts, or X-Acptoapi-Chain-Exhausted headers that non-streaming responses have. Minor diagnostic-parity gap, not a fluidity blocker (verified live: streaming itself works correctly, TTFB 5.3s, concurrent load 4-7s). Fix: buffer the served-model resolution before writeHead, or set headers via a trailer/first-chunk metadata field instead.'
  status: completed
  witness: 'lib/server.js handleChat streaming branch: res.writeHead deferred via ensureHeaders() (idempotent), fired from inside the for-await loop after the first event (success path, headers include X-Acptoapi-Served-Model + X-Acptoapi-Chain-Attempts) or from the catch block on exhaustion (headers include X-Acptoapi-Chain-Exhausted with {model,reason} array). Live-verified via curl -D against the running server (commit 6fd0d0c): success case (nvidia/meta/llama-3.2-11b-vision-instruct) showed ''X-Acptoapi-Served-Model: nvidia/meta/llama-3.2-11b-vision-instruct'' and ''X-Acptoapi-Chain-Attempts: 1''; exhaustion case (opencode-zen/claude-opus-5, credit-dead) showed ''X-Acptoapi-Chain-Exhausted: [{"model":"opencode-zen/claude-opus-5","reason":"credit_dead"}]''.'
- session_id: acptoapi-cleanup-freemodel-1
  id: prd-same-link-retry-cap-attempts
  title: Same-link retry loop has no attempt-count cap, only a time budget
  description: 'Live-witnessed: nvidia/moonshotai/kimi-k2.6 burned 19 same-link retries (~45s) as the chain lead before advancing, even though it errored on every single attempt with zero variation. sameLinkRetryDelayMs already scales delay with failStreak but failStreak here is availability.js''s CROSS-REQUEST persisted count (only 2, since recordFailure fires once per whole chain-link exhaustion, not per same-link retry attempt) - so within ONE request''s retry loop the delay barely grows and the loop just keeps hammering on a fixed SAME_LINK_RETRY_BUDGET_MS time budget alone. A model erroring identically N times in a row within the SAME request is strong evidence it will not recover in this request; add a same-request consecutive-identical-failure cap (e.g. 3-5 attempts with the SAME reason) that advances to the next link early, independent of the time budget, while still respecting the time budget as the outer bound for genuinely-transient failures that vary in nature.'
  status: completed
  witness: 'lib/chain-machine.js: added SAME_LINK_CONSECUTIVE_REASON_CAP (default 4), sameReasonStreak tracked per same-link retry loop in both runStream and runChat, checked alongside the existing time-budget/chain-deadline conditions. Live-verified directly against nvidia/moonshotai/kimi-k2.6 (the exact model witnessed burning 19 retries/~45s pre-fix): now caps at sameReasonStreak=3 (4 total attempts) and falls over in 14.2s. Re-verified via two fresh /v1/chat/completions auto-routed requests post-fix: openrouter/anthropic/claude-haiku-4.5:batch also correctly capped at sameReasonStreak=3 before advancing; opencode-zen/nemotron-3-ultra-free (a genuinely slow but working free model, ~50-56s real response time) completed successfully in 55.9s on its single legitimate attempt, no runaway retries. System behavior confirmed: retry storms are capped, genuinely-slow-but-working models still get their fair single attempt, and total chain exhaustion (when every remaining candidate really is credit_dead) returns cleanly within the 90s wall-clock budget.'
- session_id: acptoapi-okeydokey-keymgmt-2026-09-05
  id: prd-keyring-to-okeydokey
  title: Move credential handling out of lib/keyring.js into okeydokey
  description: 'lib/keyring.js held acptoapi''s own credential ordering, per-key backoff and masking, with three near-identical rotation loops on top of it in handleBrandChat, executeBrandModel and lib/passthrough.js. All of it moved to okeydokey/keyring; lib/keyring.js is now a thin adapter preserving the envKey vocabulary and the GET /v1/keyring/status field names. The three rotation loops collapsed into one shared keyring.rotateKeys. Net -128 lines across the repo.'
  status: completed
  witness: 'Differential over the pre-migration implementation and the adapter, driven with identical inputs against the same process.env: byte-identical on getKeys/getKey/listUsable/hasAnyKey/peekStatus, classify across 18 status codes, and the full markFailed/markOk/reset lifecycle including the all-keys-cooling case. The differential was shown to report DIVERGED on two reintroduced defects (indexedSuffixMax 99->9, wrong bag prefix) before its IDENTICAL result was trusted. Live-witnessed against the real groq API on a running server (port 4881) with three invalid keys spread across all three declaration conventions (GROQ_API_KEY, _1, ACPTOAPI_KEYS_ JSON bag): all three tried in order ~70ms apart, each marked auth-failed with a 30s cooldown, GET /v1/keyring/status and GET /debug/why both reporting the documented shape, and two key-rotate log lines emitted on a chain-routed request that previously logged none. Alias resolution confirmed live: GEMINI_API_KEY and GOOGLE_API_KEY both surfaced under the gemini provider.'
- session_id: acptoapi-okeydokey-keymgmt-2026-09-05
  id: prd-xai-oauth-to-okeydokey
  title: Move the xAI device-code lifecycle into okeydokey
  description: 'lib/xai-oauth.js carried its own OIDC discovery, origin pinning, RFC 8628 device grant, polling loop, refresh exchange, JWT expiry inspection and atomic token store - none xAI-specific. All moved to okeydokey/device-code; the file is now 280 lines (was 441) of xAI configuration over that engine. All 14 exports unchanged, so the six consuming modules are untouched. The on-disk token store is format-compatible in both directions so an existing login survives.'
  status: completed
  witness: 'Differential over the pre-migration module: 39 probed inputs agree, covering every constant, validateInferenceBaseUrl across allowed hosts and rejected ones (plain http, another origin, a lookalike suffix, malformed input), isAccessTokenExpiring across skew boundaries and non-JWT tokens, and the store states absent/corrupt/pre-migration-format/refresh-dead, including getCredentials resolving a token from a pre-migration record and the exact error text with no store. Live-witnessed against xAI''s own device-authorization endpoint: old and new both obtained a real device grant with identical field sets, verification host (accounts.x.ai), poll interval (5s) and expiry (1800s). All seven lib modules that require xai-oauth load clean; the server boots and serves /health.'
- session_id: acptoapi-okeydokey-keymgmt-2026-09-05
  id: prd-okeydokey-expansion
  title: Expand okeydokey with what the migration required, and fix what the move exposed
  description: 'okeydokey gained the multi-credential ring with per-credential backoff and rotation, an env credential source generalizing acptoapi''s conventions, a real RFC 8628 device-code lifecycle (the descriptor schema and README advertised device_code but no device-grant code existed anywhere, and its only error message pointed at a non-existent file), a file-backed token store, GET /api/keyring/status and GET /api/health, and the credential pool wired into its own proxy. Three pre-existing proxy defects surfaced and were fixed: encoded responses were silently truncated, streaming responses were buffered whole, and the caller''s own bearer key reached the upstream whenever the descriptor injected into a header other than Authorization.'
  status: completed
  witness: 'Keyring: 34 checks against a deterministic clock, with five reintroduced defects each confirmed to fail first. Device-code: 26 checks against a real RFC 8628 identity provider served over HTTPS, traversing authorization_pending and slow_down, proactive refresh inside the skew window with the rotated refresh token persisted, a revoked refresh token recorded as permanently dead while a transient failure was not, a discovery response naming another origin refused, and plain-http and lookalike-suffix hosts rejected; nine reintroduced defects each confirmed to fail first, control run twice for idempotency. Proxy, against a real HTTP upstream on a real socket: a three-entry pool whose first two keys were dead saw all three tried in order, the request succeed, and the next request go straight to the live key with the other two in backoff; the caller''s issued key confirmed absent from the upstream''s view; streaming measured at 6 arrivals over 1.59s tracking a 400ms-per-event upstream, against 1 arrival at 1.63s on a verified pre-fix build; a gzip upstream measured returning content-length 58 over a 223-byte decompressed body pre-fix, which truncated the JSON mid-string at the client, and correct complete JSON post-fix.'
- session_id: acptoapi-okeydokey-keymgmt-2026-09-05
  id: prd-floosie-defects
  title: Fix the floosie defects found while auditing it as the shared streaming layer
  description: 'splitStream''s pump was a detached async IIFE with no catch, so a source that threw hung both halves forever AND escaped an unhandled rejection to the process, terminating Node - createProcessor.start()''s own try/catch was bypassed entirely. Also: stopping a split did not stop its pump; only the first ERROR message was ever recorded because the push was gated on the transition being legal; stop() before start() was a no-op that left the status reading idle while start() then ran the pipeline; and zip leaked every source longer than its shortest.'
  status: completed
  witness: 'Measured before: a processor whose input threw exited Node with an uncaught "input failed" rather than rejecting; stop() left status "idle"; two ERROR events recorded one message; a 3-item source zipped against a 1-item source never ran its finally. Measured after: start() rejects with the source error, status reads "error", the message is in state.errors, no unhandled rejection escapes; stop() reads "stopped" and a restart is honest about running; both ERROR messages recorded; the longer zip source is closed. Each of the four fixes was reverted individually and confirmed to fail its check. tsc --noEmit and eslint both clean.'
