- session_id: acptoapi-cleanup-freemodel-1
  id: prd-verify-fluidity-live
  title: Verify free-model routing fluidity via live-witnessed testing
  description: 'Ran sequential, concurrent, and streaming tests against the live server (port 4800) with the latest pushed code. Findings: concurrent 3-request load completed in 4.3-6.6s each (previously 100+s under storm); streaming shows real incremental token delivery (TTFB 5.3s); credit_dead exclusion correctly skips dead models fast; total chain exhaustion (when it occurs) returns a clean response within the 90s budget, never hangs. System is meaningfully fluid, not yet perfect (see remaining PRD rows for concrete gaps).'
  status: completed
  witness: 'Live-witnessed against running server (latest code, commit c9e80ee): (1) 3 truly concurrent /v1/chat/completions requests each completed in 4.3s/4.9s/6.6s (previously 100+s under storm before this session''s fixes) - served by nvidia/meta/llama-3.2-11b-vision-instruct, real content confirmed. (2) Streaming shows genuine incremental token delivery: TTFB 5.3s, distinct SSE chunks per token/phrase, headers X-Acptoapi-Served-Model correctly present. (3) credit_dead exclusion correctly skips known-dead models in ~19-100ms via preCheck hard-exclude. (4) Sequential test x3: req1 72s (full 9-link chain walk incl. legitimate model_unhealthy fast-skips + 5x credit_dead fast-skips, ended in honest exhaustion response, never hung), req2/req3 sub-1s (cache/warm-model hits). (5) Streaming exhaustion path returns clean fallback message in ~19ms with X-Acptoapi-Chain-Exhausted header. System is meaningfully and measurably more fluid than session start; not flawless (openrouter/most-nvidia paid tiers on this account are genuinely credit-exhausted right now, a real external constraint not a code defect) but every code-level fluidity defect found this session (ranking bug, unbounded model_unhealthy wait, cross-request storm, fake streaming, unbounded chain wall-clock, missing streaming headers) is fixed and pushed.'
- session_id: acptoapi-cleanup-freemodel-1
  id: prd-streaming-headers-parity
  title: Streaming responses missing X-Acptoapi-Served-Model/Chain-Attempts/Chain-Exhausted headers
  description: 'handleChat''s new streaming branch calls res.writeHead before the served model is known (mdl is set later inside the streamFn callback) and before chain exhaustion is detected, so streaming responses never get X-Acptoapi-Served-Model, X-Acptoapi-Chain-Attempts, or X-Acptoapi-Chain-Exhausted headers that non-streaming responses have. Minor diagnostic-parity gap, not a fluidity blocker (verified live: streaming itself works correctly, TTFB 5.3s, concurrent load 4-7s). Fix: buffer the served-model resolution before writeHead, or set headers via a trailer/first-chunk metadata field instead.'
  status: completed
  witness: 'lib/server.js handleChat streaming branch: res.writeHead deferred via ensureHeaders() (idempotent), fired from inside the for-await loop after the first event (success path, headers include X-Acptoapi-Served-Model + X-Acptoapi-Chain-Attempts) or from the catch block on exhaustion (headers include X-Acptoapi-Chain-Exhausted with {model,reason} array). Live-verified via curl -D against the running server (commit 6fd0d0c): success case (nvidia/meta/llama-3.2-11b-vision-instruct) showed ''X-Acptoapi-Served-Model: nvidia/meta/llama-3.2-11b-vision-instruct'' and ''X-Acptoapi-Chain-Attempts: 1''; exhaustion case (opencode-zen/claude-opus-5, credit-dead) showed ''X-Acptoapi-Chain-Exhausted: [{"model":"opencode-zen/claude-opus-5","reason":"credit_dead"}]''.'
- session_id: acptoapi-cleanup-freemodel-1
  id: prd-same-link-retry-cap-attempts
  title: Same-link retry loop has no attempt-count cap, only a time budget
  description: 'Live-witnessed: nvidia/moonshotai/kimi-k2.6 burned 19 same-link retries (~45s) as the chain lead before advancing, even though it errored on every single attempt with zero variation. sameLinkRetryDelayMs already scales delay with failStreak but failStreak here is availability.js''s CROSS-REQUEST persisted count (only 2, since recordFailure fires once per whole chain-link exhaustion, not per same-link retry attempt) - so within ONE request''s retry loop the delay barely grows and the loop just keeps hammering on a fixed SAME_LINK_RETRY_BUDGET_MS time budget alone. A model erroring identically N times in a row within the SAME request is strong evidence it will not recover in this request; add a same-request consecutive-identical-failure cap (e.g. 3-5 attempts with the SAME reason) that advances to the next link early, independent of the time budget, while still respecting the time budget as the outer bound for genuinely-transient failures that vary in nature.'
  status: completed
  witness: 'lib/chain-machine.js: added SAME_LINK_CONSECUTIVE_REASON_CAP (default 4), sameReasonStreak tracked per same-link retry loop in both runStream and runChat, checked alongside the existing time-budget/chain-deadline conditions. Live-verified directly against nvidia/moonshotai/kimi-k2.6 (the exact model witnessed burning 19 retries/~45s pre-fix): now caps at sameReasonStreak=3 (4 total attempts) and falls over in 14.2s. Re-verified via two fresh /v1/chat/completions auto-routed requests post-fix: openrouter/anthropic/claude-haiku-4.5:batch also correctly capped at sameReasonStreak=3 before advancing; opencode-zen/nemotron-3-ultra-free (a genuinely slow but working free model, ~50-56s real response time) completed successfully in 55.9s on its single legitimate attempt, no runaway retries. System behavior confirmed: retry storms are capped, genuinely-slow-but-working models still get their fair single attempt, and total chain exhaustion (when every remaining candidate really is credit_dead) returns cleanly within the 90s wall-clock budget.'
